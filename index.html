<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0f7f4" />
  <title>我的 PWA 工具箱</title>
  <style>
    :root {
      --bg: #f0f7f4;
      --card: #ffffff;
      --primary: #2d6a4f;
      --primary-light: #52b788;
      --text: #1b4332;
      --muted: #748c82;
      --border: #d8e8e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 40px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .tools { display: grid; gap: 12px; }
    .tool {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 16px rgba(45, 106, 79, 0.06);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .tool:active { transform: scale(.985); }
    .tool:hover { box-shadow: 0 6px 20px rgba(45, 106, 79, 0.12); }
    .icon {
      flex: 0 0 44px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 22px;
    }
    .info { flex: 1; min-width: 0; }
    .name { font-size: 16px; font-weight: 650; }
    .desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .arrow { color: var(--primary-light); font-size: 18px; font-weight: 700; }
    .btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      border-radius: 16px;
    }
    footer { margin-top: 26px; text-align: center; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>我的 PWA 工具箱</h1>
  <p class="sub">收录自己写的小工具，点开即用 · 支持安装到桌面</p>

  <div class="tools">
    <a class="tool" href="./pwa/plant-todo/">
      <div class="icon">🌱</div>
      <div class="info">
        <div class="name">植愈待办 PlantTodo</div>
        <div class="desc">完成待办，养出你的小花园</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <a class="btn" href="./pwa/plant-todo/">进入植愈待办 →</a>

  <footer>以后新增的工具放在 <code>pwa/&lt;名称&gt;/</code> 下即可</footer>
</body>
</html>
